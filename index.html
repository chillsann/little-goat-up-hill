<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
  <title>小羊上山识字大冒险 · 有声版</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; user-select: none;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    body {
      background: linear-gradient(180deg, #b8e4b0 0%, #d4f0d0 30%, #fef9e4 70%, #ffe6b3 100%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; margin: 0;
    }
    .game-container {
      width: 100%; max-width: 500px; background: rgba(255,251,235,0.85); backdrop-filter: blur(8px);
      border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); padding: 20px 15px 25px;
      display: flex; flex-direction: column; align-items: center; position: relative; min-height: 90vh;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .sheep-icon { font-size: 42px; animation: bounce 1.2s infinite alternate; }
    @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
    .title { font-size: 28px; font-weight: 800; color: #4a6b2f; text-shadow: 2px 2px 0 #fff; }
    .star-counter {
      background: #ffe484; border-radius: 30px; padding: 6px 18px; font-weight: bold;
      color: #7b5e3b; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      margin-bottom: 10px;
    }
    .screen { width: 100%; display: flex; flex-direction: column; align-items: center; flex: 1; }
    .hidden { display: none !important; }
    .start-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    .big-btn {
      background: #ffb84d; border: none; border-radius: 50px; padding: 16px 40px; font-size: 28px;
      font-weight: 700; color: #fff; letter-spacing: 4px; box-shadow: 0 10px 0 #d68c2c; cursor: pointer;
      transition: all 0.1s; margin: 10px 0; -webkit-tap-highlight-color: transparent;
    }
    .big-btn:active { transform: translateY(6px); box-shadow: 0 4px 0 #d68c2c; background: #ffa32b; }
    .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; margin-top: 10px; }
    .level-card {
      background: #ffffffdd; border-radius: 25px; padding: 15px 8px; text-align: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1); cursor: pointer; border: 3px solid #e0d7b0;
    }
    .level-card:active { transform: scale(0.94); background: #fffef0; }
    .level-card.locked { filter: grayscale(0.5); background: #e9e3d0; color: #aaa; }
    .group-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 20px 0; }
    .group-btn {
      width: 58px; height: 58px; border-radius: 50%; background: #ffe9c4; border: 3px solid #deb887;
      font-weight: bold; font-size: 18px; color: #6b4f32; display: flex; align-items: center;
      justify-content: center; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .group-btn:active { transform: scale(0.9); background: #f7d98c; }
    .group-btn.completed { background: #b2e0a8; border-color: #6b9e4a; color: #2d5720; position: relative; }
    .group-btn.completed::after { content: "⭐"; font-size: 20px; position: absolute; top: -8px; right: -6px; }
    .group-btn.locked { opacity: 0.5; pointer-events: none; background: #ddd8cb; border-color: #bbb; color: #999; }
    .big-character {
      font-size: 100px; font-weight: 900; color: #4e342e; background: #fff3e0; border-radius: 30px;
      padding: 10px 30px; margin: 10px 0; box-shadow: 0 10px 20px rgba(0,0,0,0.1); cursor: pointer;
      transition: transform 0.1s, background 0.1s, box-shadow 0.1s; min-width: 140px; text-align: center;
      position: relative;
    }
    .big-character:active { transform: scale(0.94); background: #ffe0b2; }
    .big-character.touched { background: #ffe0b2 !important; box-shadow: 0 0 0 6px rgba(255,183,77,0.5); }
    .options-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-top: 15px; }
    .option-card {
      background: #fffbf0; border: 4px solid #d4b68a; border-radius: 30px; padding: 15px 5px;
      font-size: 50px; font-weight: bold; color: #5d4037; text-align: center; cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }
    .option-card:active { transform: scale(0.9); background: #f5e7c8; }
    .option-card.correct-highlight { background: #c8f7c5 !important; border-color: #4caf50 !important; animation: pop 0.35s; }
    .option-card.wrong-flash { background: #ffcdd2 !important; border-color: #e53935 !important; animation: shake 0.4s; }
    @keyframes shake { 0%,100%{ transform: translateX(0); } 25%{ transform: translateX(-8px); } 75%{ transform: translateX(8px); } }
    @keyframes pop { 0%{ transform: scale(1); } 50%{ transform: scale(1.08); } 100%{ transform: scale(1); } }
    .message-box { font-size: 20px; font-weight: 600; color: #3e6b27; margin: 8px 0; min-height: 32px; }
    .tap-hint { font-size: 16px; color: #8b7a4c; background: #fffae9; padding: 4px 18px; border-radius: 20px; margin-bottom: 5px; }
    .btn {
      background: #ffb84d; border: none; border-radius: 40px; padding: 12px 28px; font-size: 20px;
      font-weight: 700; color: #fff; letter-spacing: 2px; box-shadow: 0 6px 0 #d68c2c; cursor: pointer;
      margin: 5px; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d68c2c; background: #ffa32b; }
    .btn.back { background: #b0c4de; box-shadow: 0 6px 0 #7a8fa6; }
    .progress-bar { width: 100%; background: #e0d7c6; border-radius: 20px; height: 16px; margin: 8px 0; overflow: hidden; }
    .progress-fill { height: 100%; background: #f9a825; border-radius: 20px; transition: width 0.3s; }
    .star-rain {
      position: fixed; pointer-events: none; font-size: 32px; animation: starFall 1.2s ease-out forwards; z-index: 100;
    }
    @keyframes starFall {
      0% { opacity: 1; transform: translateY(0) rotate(0deg); } 100% { opacity: 0; transform: translateY(160px) rotate(200deg); }
    }
    .audio-status {
      font-size: 14px; color: #8b7a4c; margin: 5px 0; background: #fffae9; border-radius: 20px; padding: 4px 16px;
    }
  </style>
</head>
<body>
<div class="game-container" id="app">
  <div class="header">
    <span class="sheep-icon">🐑</span>
    <span class="title">小羊上山</span>
  </div>
  <div class="star-counter" id="starDisplay">⭐ 0 颗星星</div>

  <div id="startScreen" class="start-screen">
    <div style="font-size:60px;">🐑🌄</div>
    <div style="font-size:22px;font-weight:600;color:#5e4b2b;">小羊上山识字大冒险</div>
    <button class="big-btn" id="startBtn">开 始 冒 险</button>
    <div class="audio-status" id="audioStatus">🔊 音频准备就绪</div>
  </div>

  <div id="mapScreen" class="screen hidden">
    <div style="font-size:18px;font-weight:600;color:#5e4b2b;margin-bottom:5px;">🌄 选择关卡</div>
    <div class="level-grid" id="levelGrid"></div>
  </div>

  <div id="groupScreen" class="screen hidden">
    <div id="groupTitle" style="font-size:22px;font-weight:700;color:#3e5e24;margin:5px 0;"></div>
    <div class="group-grid" id="groupContainer"></div>
    <button class="btn back" id="backToMapBtn">↩ 返回地图</button>
  </div>

  <div id="gameScreen" class="screen hidden">
    <div id="gameLevelInfo" style="font-weight:600;color:#6b4f32;font-size:18px;"></div>
    <div class="big-character" id="targetChar">羊</div>
    <div class="tap-hint">👆 点汉字听发音</div>
    <div class="message-box" id="gameMessage">🐑 找找这个字吧！</div>
    <div class="options-row" id="optionsContainer"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <button class="btn back hidden" id="finishGroupBtn" style="margin-top:15px;">🎉 完成本组</button>
  </div>

  <div id="quizScreen" class="screen hidden">
    <div style="font-size:24px;font-weight:700;color:#b45f06;">🏆 关卡小测验</div>
    <div class="big-character" id="quizTarget">山</div>
    <div class="tap-hint">👆 点汉字听发音</div>
    <div class="message-box" id="quizMessage">🔊 听一听，找一找</div>
    <div class="options-row" id="quizOptions"></div>
    <button class="btn back hidden" id="quizCompleteBtn" style="margin-top:15px;">🎊 测验完成</button>
  </div>
</div>

<script>
  (function() {
    // ---------- 字库 ----------
    const LEVELS = [
      { name: "青草坡", emoji: "🌱", words: ["一","二","三","四","五","六","七","八","九","十","两","只","头","又","了","不","大","小","上","下","多","少","白","天","云","山","太","阳","月","亮","星","马","牛","羊","兔","虫","鸟","花","草","树","地","吃","看","走","笑","来","飞","爱","是","跑","跳","高","兴","快","乐","好","的","爸","妈","我"] },
      { name: "小树林", emoji: "🌿", words: ["水","火","木","金","土","左","右","中","年","口","目","耳","手","足","心","子","女","王","田","百","千","万","黑","红","蓝","绿","黄","高","矮","长","短","圆","方","正","生","死","喜","怒","哀","惧","恨","静","动","开","关","进","出","站","坐","听","说","读","写","学","哥","姐","弟","妹","男","老","姓","名","叔","婶","爷","奶","英","国","美","韩","德","法","俄","印","非","欧","澳","洲","亚"] },
      { name: "星星谷", emoji: "⭐", words: ["石","沙","风","雨","雪","春","夏","秋","冬","冷","暖","热","凉","河","海","湖","江","田","园","林","路","门","窗","桌","椅","床","灯","衣","帽","鞋","袜","米","面","饭","菜","肉","蛋","奶","果","瓜","叶","根","茎","种","芽","苗","禾","森","林","草","花","树","叶","虫","鸟","鱼","虾","贝","壳"] },
      { name: "彩虹桥", emoji: "🌈", words: ["声","音","歌","唱","画","写","字","句","诗","书","本","笔","纸","尺","刀","剪","贴","粘","折","撕","拉","推","抱","捧","拿","放","送","给","买","卖","钱","元","角","分","钟","表","时","间","早","晚","今","明","昨","前","后","里","外","旁","边","对","错","真","假","美","丑","新","旧"] },
      { name: "白云顶", emoji: "☁️", words: ["知","道","想","思","念","记","忘","懂","会","能","可","以","因","为","所","但","如","果","虽","然","比","较","更","最","很","太","非","常","都","全","就","才","还","也","又","再","每","各","别","其","他","什","么","怎","样","这","那","哪","谁","几","多","少","次","回","遍","些","点","块","条","只","头","朵","颗","棵","座","间","辆","艘","吧"] },
      { name: "太阳城堡", emoji: "☀️", words: ["教","育","培","养","保","护","帮","助","关","心","照","顾","学","习","练","复","预","检","查","测","验","考","试","合","格","优","秀","进","步","努","力","认","识","阅","读","理","解","表","达","沟","通","交","流","分","享","作","团","队","朋","友","伙","伴","同","老","师","校","园","室","操","场","图","书","馆","实","验","手","工","绘","画"] }
    ];

    const GROUP_SIZE = 5;
    let currentLevelIndex = 0, currentGroupIndex = 0;
    let currentWords = [], currentQuizWords = [];
    let gameActive = false, quizActive = false, totalStars = 0;

    let progress = { unlockedLevel: 1, completedGroups: {}, stars: 0 };

    // DOM 元素
    const startScreen = document.getElementById('startScreen');
    const mapScreen = document.getElementById('mapScreen');
    const groupScreen = document.getElementById('groupScreen');
    const gameScreen = document.getElementById('gameScreen');
    const quizScreen = document.getElementById('quizScreen');
    const levelGrid = document.getElementById('levelGrid');
    const groupTitle = document.getElementById('groupTitle');
    const groupContainer = document.getElementById('groupContainer');
    const targetChar = document.getElementById('targetChar');
    const gameMessage = document.getElementById('gameMessage');
    const optionsContainer = document.getElementById('optionsContainer');
    const progressFill = document.getElementById('progressFill');
    const finishGroupBtn = document.getElementById('finishGroupBtn');
    const starDisplay = document.getElementById('starDisplay');
    const gameLevelInfo = document.getElementById('gameLevelInfo');
    const quizTarget = document.getElementById('quizTarget');
    const quizMessage = document.getElementById('quizMessage');
    const quizOptions = document.getElementById('quizOptions');
    const quizCompleteBtn = document.getElementById('quizCompleteBtn');
    const audioStatus = document.getElementById('audioStatus');

    // ====== 音频系统 ======
    let audioCtx = null;
    function createAudioContext() {
      if (audioCtx) return;
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    function resumeAudio() { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
    // 触摸激活音频上下文
    document.addEventListener('touchstart', () => {
      createAudioContext(); resumeAudio();
      if (audioCtx) {
        const buf = audioCtx.createBuffer(1, 1, 22050);
        const src = audioCtx.createBufferSource();
        src.buffer = buf; src.connect(audioCtx.destination);
        src.start(0);
      }
    }, { passive: true, once: true });

    function playBeep(freq, type, dur = 0.15) {
      if (!audioCtx) createAudioContext();
      resumeAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.value = freq; gain.gain.value = 0.25;
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }
    function soundCorrect() { playBeep(660, 'sine', 0.2); setTimeout(()=>playBeep(880, 'sine', 0.25), 150); }
    function soundWrong() { playBeep(200, 'triangle', 0.3); }

    // 播放预录制音频文件
    function speak(text) {
      playBeep(800, 'sine', 0.12); // 叮咚提示音
      const audio = new Audio('audio/' + text + '.mp3');
      audio.volume = 1;
      audio.play().catch(err => {
        // 静默处理，不影响游戏
        console.warn('音频播放失败: ' + text, err);
      });
    }

    // 视觉反馈
    function triggerTouchFeedback(el) {
      el.classList.add('touched');
      setTimeout(() => el.classList.remove('touched'), 200);
    }

    // 进度管理
    function saveProgress() {
      progress.stars = totalStars;
      localStorage.setItem('sheep_mountain_progress', JSON.stringify(progress));
    }
    function loadProgress() {
      const saved = localStorage.getItem('sheep_mountain_progress');
      if (saved) {
        try {
          const obj = JSON.parse(saved);
          progress = obj;
          totalStars = progress.stars || 0;
          if (!progress.completedGroups) progress.completedGroups = {};
          if (typeof progress.unlockedLevel !== 'number') progress.unlockedLevel = 1;
        } catch(e) { resetProgress(); }
      } else {
        resetProgress();
      }
      updateStarDisplay();
    }
    function resetProgress() {
      progress = { unlockedLevel: 1, completedGroups: {}, stars: 0 };
      totalStars = 0;
      saveProgress();
    }
    function updateStarDisplay() {
      starDisplay.textContent = `⭐ ${totalStars} 颗星星`;
    }
    function addStars(n) {
      totalStars += n;
      updateStarDisplay();
      saveProgress();
    }
    function isGroupCompleted(li, gi) {
      return progress.completedGroups[li] && progress.completedGroups[li].includes(gi);
    }
    function markGroupCompleted(li, gi) {
      if (!progress.completedGroups[li]) progress.completedGroups[li] = [];
      if (!progress.completedGroups[li].includes(gi)) {
        progress.completedGroups[li].push(gi);
        saveProgress();
      }
    }
    function getTotalGroups(li) { return Math.ceil(LEVELS[li].words.length / GROUP_SIZE); }
    function isLevelFullyCompleted(li) {
      for (let i = 0; i < getTotalGroups(li); i++) if (!isGroupCompleted(li, i)) return false;
      return true;
    }
    function spawnStars(count = 8) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const s = document.createElement('div');
          s.className = 'star-rain';
          s.textContent = '⭐';
          s.style.left = Math.random() * 80 + '%';
          s.style.top = Math.random() * 40 + '%';
          document.body.appendChild(s);
          setTimeout(() => s.remove(), 1300);
        }, i * 80);
      }
    }

    // 启动按钮
    document.getElementById('startBtn').addEventListener('click', () => {
      // 播放测试音，验证音频路径
      const testAudio = new Audio('audio/一.mp3');
      testAudio.volume = 0.3;
      testAudio.play().then(() => {
        audioStatus.textContent = '✅ 音频系统正常，尽情玩吧！';
      }).catch(() => {
        audioStatus.textContent = '⚠️ 未找到音频文件，但叮咚音效正常';
      });
      startScreen.classList.add('hidden');
      mapScreen.classList.remove('hidden');
      renderMap();
    });

    // 渲染地图
    function renderMap() {
      levelGrid.innerHTML = '';
      LEVELS.forEach((level, idx) => {
        const card = document.createElement('div');
        card.className = 'level-card';
        const unlocked = idx < progress.unlockedLevel;
        if (!unlocked) card.classList.add('locked');
        const completed = isLevelFullyCompleted(idx);
        card.innerHTML = `
          <div class="level-emoji">${level.emoji}</div>
          <div class="level-name">第${idx+1}关·${level.name}</div>
          <div class="level-stars">${completed ? '🌟 已通关' : (unlocked ? '🔓 可挑战' : '🔒 未解锁')}</div>
        `;
        card.addEventListener('click', () => {
          if (!unlocked) { speak('这一关还没解锁哦，继续加油吧！'); return; }
          openLevel(idx);
        });
        levelGrid.appendChild(card);
      });
    }

    function openLevel(li) {
      currentLevelIndex = li;
      mapScreen.classList.add('hidden');
      groupScreen.classList.remove('hidden');
      renderGroups();
    }

    function renderGroups() {
      const level = LEVELS[currentLevelIndex];
      groupTitle.textContent = `🐑 ${level.name} · 第${currentLevelIndex+1}关`;
      const total = getTotalGroups(currentLevelIndex);
      groupContainer.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const btn = document.createElement('div');
        btn.className = 'group-btn';
        btn.textContent = i+1;
        if (isGroupCompleted(currentLevelIndex, i)) {
          btn.classList.add('completed');
        } else if (i > 0 && !isGroupCompleted(currentLevelIndex, i-1)) {
          btn.classList.add('locked');
        }
        btn.addEventListener('click', () => {
          if (btn.classList.contains('locked')) { speak('先完成前面的一组吧'); return; }
          startGroupGame(i);
        });
        groupContainer.appendChild(btn);
      }
    }

    function getGroupWords(li, gi) {
      const all = LEVELS[li].words;
      return all.slice(gi * GROUP_SIZE, gi * GROUP_SIZE + GROUP_SIZE);
    }

    function startGroupGame(gi) {
      currentGroupIndex = gi;
      currentWords = [...getGroupWords(currentLevelIndex, gi)];
      gameActive = true;
      groupScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      finishGroupBtn.classList.add('hidden');
      gameLevelInfo.textContent = `📖 第${currentLevelIndex+1}关 · 第${gi+1}组`;
      progressFill.style.width = '0%';
      nextGameRound();
    }

    let gameRoundWords = [], gameRoundIndex = 0;
    function nextGameRound() {
      if (!gameActive) return;
      if (gameRoundWords.length === 0 || gameRoundIndex >= gameRoundWords.length) {
        if (currentWords.length === 0) { finishGroup(); return; }
        gameRoundWords = [...currentWords];
        shuffleArray(gameRoundWords);
        gameRoundIndex = 0;
      }
      const word = gameRoundWords[gameRoundIndex];
      showGameWord(word);
    }

    function showGameWord(word) {
      targetChar.textContent = word;
      gameMessage.textContent = '🐑 找找相同的字吧！';
      const correct = word;
      const distractors = getDistractors(correct, 3, currentLevelIndex);
      const options = [correct, ...distractors];
      shuffleArray(options);
      optionsContainer.innerHTML = '';
      options.forEach(opt => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.textContent = opt;
        card.addEventListener('click', (e) => handleGameOption(card, opt, correct));
        optionsContainer.appendChild(card);
      });
      progressFill.style.width = ((gameRoundIndex / gameRoundWords.length) * 100) + '%';
      targetChar.onclick = () => {
        triggerTouchFeedback(targetChar);
        speak(targetChar.textContent);
      };
    }

    function handleGameOption(card, selected, correct) {
      if (!gameActive) return;
      const allCards = document.querySelectorAll('#optionsContainer .option-card');
      if (selected === correct) {
        card.classList.add('correct-highlight');
        gameMessage.textContent = '🎉 太棒了！就是这个字！';
        soundCorrect();
        speak(correct);
        spawnStars(6);
        const idx = currentWords.indexOf(correct);
        if (idx > -1) currentWords.splice(idx, 1);
        gameRoundIndex++;
        setTimeout(() => {
          if (currentWords.length === 0) finishGroup();
          else nextGameRound();
        }, 900);
      } else {
        card.classList.add('wrong-flash');
        soundWrong();
        gameMessage.textContent = '🤔 再试试看！';
        allCards.forEach(c => { if (c.textContent === correct) c.classList.add('correct-highlight'); });
        speak(correct);
        setTimeout(() => {
          card.classList.remove('wrong-flash');
          allCards.forEach(c => c.classList.remove('correct-highlight'));
        }, 1500);
        const correctCard = Array.from(allCards).find(c => c.textContent === correct);
        if (correctCard) {
          correctCard.addEventListener('click', function handler() {
            correctCard.removeEventListener('click', handler);
            handleGameOption(correctCard, correct, correct);
          }, { once: true });
        }
      }
    }

    function finishGroup() {
      gameActive = false;
      markGroupCompleted(currentLevelIndex, currentGroupIndex);
      addStars(5);
      gameMessage.textContent = '✨ 你好厉害！这一组完成啦！';
      finishGroupBtn.classList.remove('hidden');
      progressFill.style.width = '100%';
      spawnStars(10);
      speak('太厉害了，这组字你都认识啦！');
      finishGroupBtn.onclick = () => {
        gameScreen.classList.add('hidden');
        if (isLevelFullyCompleted(currentLevelIndex)) startLevelQuiz();
        else { groupScreen.classList.remove('hidden'); renderGroups(); }
      };
    }

    function startLevelQuiz() {
      const allWords = LEVELS[currentLevelIndex].words;
      currentQuizWords = [...allWords];
      shuffleArray(currentQuizWords);
      currentQuizWords = currentQuizWords.slice(0, Math.min(10, currentQuizWords.length));
      quizActive = true;
      groupScreen.classList.add('hidden');
      gameScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      quizCompleteBtn.classList.add('hidden');
      nextQuizRound();
    }

    let quizIndex = 0;
    function nextQuizRound() {
      if (!quizActive) return;
      if (quizIndex >= currentQuizWords.length) { finishQuiz(); return; }
      const word = currentQuizWords[quizIndex];
      quizTarget.textContent = word;
      quizMessage.textContent = '🔊 听一听，找一找这个字';
      const correct = word;
      const distractors = getDistractors(correct, 3, currentLevelIndex);
      const options = [correct, ...distractors];
      shuffleArray(options);
      quizOptions.innerHTML = '';
      options.forEach(opt => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.textContent = opt;
        card.addEventListener('click', (e) => handleQuizOption(card, opt, correct));
        quizOptions.appendChild(card);
      });
      quizTarget.onclick = () => {
        triggerTouchFeedback(quizTarget);
        speak(quizTarget.textContent);
      };
    }

    function handleQuizOption(card, selected, correct) {
      if (!quizActive) return;
      const allCards = document.querySelectorAll('#quizOptions .option-card');
      if (selected === correct) {
        card.classList.add('correct-highlight');
        soundCorrect();
        quizMessage.textContent = '✅ 答对了！';
        speak(correct);
        quizIndex++;
        setTimeout(nextQuizRound, 800);
      } else {
        card.classList.add('wrong-flash');
        soundWrong();
        quizMessage.textContent = '💡 这个是 ' + correct;
        allCards.forEach(c => { if (c.textContent === correct) c.classList.add('correct-highlight'); });
        speak(correct);
        setTimeout(() => {
          card.classList.remove('wrong-flash');
          allCards.forEach(c => c.classList.remove('correct-highlight'));
          quizIndex++;
          nextQuizRound();
        }, 1800);
      }
    }

    function finishQuiz() {
      quizActive = false;
      quizMessage.textContent = '🏅 测验完成！你真是识字小英雄！';
      quizCompleteBtn.classList.remove('hidden');
      spawnStars(14);
      speak('恭喜你，通过了第' + (currentLevelIndex+1) + '关！');
      if (currentLevelIndex + 1 < LEVELS.length && progress.unlockedLevel <= currentLevelIndex + 1) {
        progress.unlockedLevel = currentLevelIndex + 2;
        saveProgress();
      }
      addStars(10);
      quizCompleteBtn.onclick = () => {
        quizScreen.classList.add('hidden');
        mapScreen.classList.remove('hidden');
        renderMap();
      };
    }

    function getDistractors(correct, count, li) {
      const pool = [];
      for (let i = Math.max(0, li-1); i <= Math.min(LEVELS.length-1, li+1); i++) {
        pool.push(...LEVELS[i].words.filter(w => w !== correct));
      }
      const unique = [...new Set(pool)];
      shuffleArray(unique);
      return unique.slice(0, count);
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    document.getElementById('backToMapBtn').addEventListener('click', () => {
      groupScreen.classList.add('hidden');
      mapScreen.classList.remove('hidden');
      renderMap();
    });

    // 初始化
    loadProgress();
    startScreen.classList.remove('hidden');
    mapScreen.classList.add('hidden');
  })();
</script>
</body>
</html>
