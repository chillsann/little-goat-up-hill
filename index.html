    .group-btn {

    .options-grid {

    // 音频上下文
    let audioCtx = null;
    function createAudioContext() {
      if (audioCtx) return;
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    function resumeAudio() { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
    document.addEventListener('touchstart', () => {
      createAudioContext(); resumeAudio();
      if (audioCtx) {
        const buf = audioCtx.createBuffer(1,1,22050);
        const src = audioCtx.createBufferSource(); src.buffer = buf;
        src.connect(audioCtx.destination); src.start(0);
      }
    }, { passive: true, once: true });

    function playBeep(freq, type, dur=0.15) {
      if (!audioCtx) createAudioContext(); resumeAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.value = freq; gain.gain.value = 0.25;
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }
    function soundCorrect() { playBeep(660,'sine',0.2); setTimeout(()=>playBeep(880,'sine',0.25),150); }
    function soundWrong() { playBeep(200,'triangle',0.3); }

    function playCharAudio(char) {
      return new Promise((resolve) => {
        const audio = new Audio('audio/' + char + '.mp3');
        audio.volume = 1;
        audio.onended = resolve;
        audio.onerror = () => resolve();
        audio.play().catch(() => resolve());
      });
    }

    // 检测语音合成是否可用
    async function detectSpeech() {
      if (!window.speechSynthesis) return false;
      // 尝试获取语音列表
      const voices = speechSynthesis.getVoices();
      if (voices.length > 0) return voices.some(v => v.lang.includes('zh'));
      return new Promise(resolve => {
        speechSynthesis.onvoiceschanged = () => {
          const v = speechSynthesis.getVoices();
          resolve(v.some(vo => vo.lang.includes('zh')));
        };
        setTimeout(() => resolve(false), 1500);
      });
    }

    // 用系统语音朗读词组
    function speakGroups(groups) {
      if (!speechSupported || !window.speechSynthesis) return;
      const text = groups.join('， '); // 用逗号分隔，自然停顿
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-CN';
      utter.rate = 0.85;
      utter.pitch = 1;
      utter.volume = 1;
      window.speechSynthesis.speak(utter);
    }

    // 快速连读 MP3 词组（回退方案）
    async function fallbackSpeakGroups(groups) {
      for (let i = 0; i < groups.length; i++) {
        const word = groups[i];
        for (const c of word) {
          await playCharAudio(c);
          await new Promise(r => setTimeout(r, 50)); // 缩短间隔
        }
        if (i < groups.length - 1) {
          await new Promise(r => setTimeout(r, 300)); // 词组间停顿
        }
      }
    }

    // 核心：播放单字 + 词组
    async function playWordWithGroup(char) {
      playBeep(800, 'sine', 0.12);
      await playCharAudio(char); // 单字仍然用 MP3

      const groups = wordGroups[char];
      if (groups && groups.length > 0) {
        // 随机选 2~3 个词组
        const shuffled = [...groups].sort(() => Math.random() - 0.5);
        const selected = shuffled.slice(0, Math.min(3, shuffled.length));

        if (speechSupported) {
          // 语音合成模式：自然朗读词组
          speakGroups(selected);
        } else {
          // 回退模式：快速连读 MP3
          await fallbackSpeakGroups(selected);
        }
      }
    }

    // 初始化语音检测
    async function initSpeech() {
      speechSupported = await detectSpeech();
      if (speechSupported) {
        modeHintElem.textContent = '✅ 自然朗读模式已开启';
        globalModeHint.textContent = '';
        globalModeHint.classList.add('hidden');
      } else {
        modeHintElem.textContent = '🔇 快速连读模式（词组由单字合成）';
        globalModeHint.textContent = '💡 词组朗读已优化，仍建议家长陪读';
        globalModeHint.classList.remove('hidden');
      }
    }

    // 进度
    function saveProgress() {
      progress.stars = totalStars;
      localStorage.setItem('sheep_mountain_progress', JSON.stringify(progress));
    }
    function loadProgress() {
      const saved = localStorage.getItem('sheep_mountain_progress');
      if (saved) {
        try {
          const obj = JSON.parse(saved);
          progress = obj;
          totalStars = progress.stars || 0;
          if (!progress.completedGroups) progress.completedGroups = {};
          if (typeof progress.unlockedLevel !== 'number') progress.unlockedLevel = 1;
        } catch(e) { resetProgress(); }
      } else { resetProgress(); }
      updateStarDisplay();
    }
    function resetProgress() {
      progress = { unlockedLevel: 1, completedGroups: {}, stars: 0 };
      totalStars = 0;
      saveProgress();
    }
    function updateStarDisplay() { starDisplay.textContent = `⭐ ${totalStars} 颗星星`; }
    function addStars(n) { totalStars += n; updateStarDisplay(); saveProgress(); }
    function isGroupCompleted(li, gi) { return progress.completedGroups[li]?.includes(gi); }
    function markGroupCompleted(li, gi) {
      if (!progress.completedGroups[li]) progress.completedGroups[li] = [];
      if (!progress.completedGroups[li].includes(gi)) { progress.completedGroups[li].push(gi); saveProgress(); }
    }
    function getTotalGroups(li) { return Math.ceil(LEVELS[li].words.length / GROUP_SIZE); }
    function isLevelFullyCompleted(li) {
      for (let i = 0; i < getTotalGroups(li); i++) if (!isGroupCompleted(li,i)) return false;
      return true;
    }
    function spawnStars(count=8) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const s = document.createElement('div'); s.className='star-rain'; s.textContent='⭐';
          s.style.left=Math.random()*80+'%'; s.style.top=Math.random()*40+'%';
          document.body.appendChild(s); setTimeout(()=>s.remove(),1300);
        }, i*80);
      }
    }

    // 启动按钮（增加语音检测）
    document.getElementById('startBtn').addEventListener('click', async () => {
      document.getElementById('startBtn').disabled = true;
      modeHintElem.textContent = '正在检测朗读引擎...';
      await initSpeech();
      startScreen.classList.add('hidden');
      mapScreen.classList.remove('hidden');
      renderMap();
    });

    function renderMap() {
      levelGrid.innerHTML = '';
      LEVELS.forEach((level, idx) => {
        const card = document.createElement('div'); card.className = 'level-card';
        const unlocked = idx < progress.unlockedLevel;
        if (!unlocked) card.classList.add('locked');
        const completed = isLevelFullyCompleted(idx);
        card.innerHTML = `<div class="level-emoji">${level.emoji}</div><div class="level-name">第${idx+1}关·${level.name}</div><div class="level-stars">${completed?'🌟已通关':(unlocked?'🔓可挑战':'🔒未解锁')}</div>`;
        card.addEventListener('click', () => {
          if (!unlocked) { playBeep(300,'triangle',0.3); return; }
          openLevel(idx);
        });
        levelGrid.appendChild(card);
      });
    }
    function openLevel(li) {
      currentLevelIndex = li;
      mapScreen.classList.add('hidden'); groupScreen.classList.remove('hidden');
      renderGroups();
    }
    function renderGroups() {
      const level = LEVELS[currentLevelIndex];
      groupTitle.textContent = `🐑 ${level.name} · 第${currentLevelIndex+1}关`;
      const total = getTotalGroups(currentLevelIndex);
      groupContainer.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const btn = document.createElement('div'); btn.className = 'group-btn'; btn.textContent = i+1;
        if (isGroupCompleted(currentLevelIndex, i)) btn.classList.add('completed');
        else if (i > 0 && !isGroupCompleted(currentLevelIndex, i-1)) btn.classList.add('locked');
        btn.addEventListener('click', () => {
          if (btn.classList.contains('locked')) { playBeep(300,'triangle',0.3); return; }
          startGroupGame(i);
        });
        groupContainer.appendChild(btn);
      }
    }

    let currentRoundWord = null;
    let wrongAttempts = 0;

    function startGroupGame(gi) {
      currentGroupIndex = gi;
      currentWords = [...getGroupWords(currentLevelIndex, gi)];
      gameActive = true;
      groupScreen.classList.add('hidden'); gameScreen.classList.remove('hidden');
      finishGroupBtn.classList.add('hidden');
      gameLevelInfo.textContent = `📖 第${currentLevelIndex+1}关 · 第${gi+1}组`;
      progressFill.style.width = '0%';
      nextWord();
    }

    function getGroupWords(li, gi) {
      return LEVELS[li].words.slice(gi*GROUP_SIZE, gi*GROUP_SIZE+GROUP_SIZE);
    }

    function nextWord() {
      if (!gameActive || currentWords.length === 0) {
        finishGroup();
        return;
      }
      const word = currentWords[0];
      currentRoundWord = word;
      wrongAttempts = 0;
      retryHint.textContent = '';
      gameMessage.textContent = '🔊 先听听小羊怎么说！';
      optionsContainer.innerHTML = '';
      playAudioBtn.classList.remove('playing');

      const correct = word;
      const distractors = getDistractors(correct, 3, currentLevelIndex);
      const options = [correct, ...distractors];
      shuffleArray(options);
      options.forEach(opt => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.textContent = opt;
        card.addEventListener('click', () => handleGameChoice(card, opt, correct));
        optionsContainer.appendChild(card);
      });

      const totalWords = getGroupWords(currentLevelIndex, currentGroupIndex).length;
      const completed = totalWords - currentWords.length;
      progressFill.style.width = ((completed / totalWords) * 100) + '%';

      playAudioBtn.onclick = () => {
        if (playAudioBtn.classList.contains('playing')) return;
        playAudioBtn.classList.add('playing');
        playWordWithGroup(word).then(() => {
          playAudioBtn.classList.remove('playing');
        });
      };
    }

    function handleGameChoice(card, selected, correct) {
      if (!gameActive) return;
      const allCards = document.querySelectorAll('#optionsContainer .option-card');
      if (selected === correct) {
        card.classList.add('correct-highlight');
        soundCorrect();
        gameMessage.textContent = '🎉 太棒了！你找对啦！';
        spawnStars(5);
        addStars(1);
        currentWords.shift();
        setTimeout(() => {
          if (currentWords.length > 0) nextWord();
          else finishGroup();
        }, 1000);
      } else {
        wrongAttempts++;
        card.classList.add('wrong-flash');
        soundWrong();
        if (wrongAttempts < 2) {
          gameMessage.textContent = `🤔 不对哦，再听一次试试？（还可以错${2-wrongAttempts}次）`;
          retryHint.textContent = `再听听看，是哪个字呢？`;
        } else {
          gameMessage.textContent = '💡 这个字是“' + correct + '”，记住它哟！';
          retryHint.textContent = '';
          allCards.forEach(c => {
            if (c.textContent === correct) c.classList.add('correct-highlight');
          });
          currentWords.shift();
          setTimeout(() => {
            if (currentWords.length > 0) nextWord();
            else finishGroup();
          }, 1500);
        }
        setTimeout(() => {
          card.classList.remove('wrong-flash');
          allCards.forEach(c => c.classList.remove('correct-highlight'));
        }, 1200);
      }
    }

    function finishGroup() {
      gameActive = false;
      markGroupCompleted(currentLevelIndex, currentGroupIndex);

      gameMessage.textContent = '✨ 你好厉害！这一组完成啦！';

    function startLevelQuiz() {
      const allWords = LEVELS[currentLevelIndex].words;
      currentQuizWords = [...allWords];

      nextQuizWord();

    let currentQuizWord = null;
    let quizWrongAttempts = 0;

    function nextQuizWord() {
      if (!quizActive || currentQuizWords.length === 0) {
        finishQuiz();
        return;
      }
      const word = currentQuizWords[0];
      currentQuizWord = word;
      quizWrongAttempts = 0;
      quizMessage.textContent = '🔊 听听看，是哪个字？';
      quizOptionsContainer.innerHTML = '';
      quizPlayBtn.classList.remove('playing');

      const correct = word;
      const distractors = getDistractors(correct, 3, currentLevelIndex);
      const options = [correct, ...distractors];
      shuffleArray(options);
      options.forEach(opt => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.textContent = opt;
        card.addEventListener('click', () => handleQuizChoice(card, opt, correct));

      quizPlayBtn.onclick = () => {
        if (quizPlayBtn.classList.contains('playing')) return;
        quizPlayBtn.classList.add('playing');
        playWordWithGroup(word).then(() => {
          quizPlayBtn.classList.remove('playing');
        });
      };
    }

    function handleQuizChoice(card, selected, correct) {
      if (!quizActive) return;
      const allCards = document.querySelectorAll('#quizOptionsContainer .option-card');
      if (selected === correct) {
        card.classList.add('correct-highlight');
        soundCorrect();
        quizMessage.textContent = '✅ 答对了！';
        addStars(2);
        currentQuizWords.shift();
        setTimeout(() => {
          if (currentQuizWords.length > 0) nextQuizWord();
          else finishQuiz();
        }, 800);
      } else {
        quizWrongAttempts++;
        card.classList.add('wrong-flash');
        soundWrong();
        if (quizWrongAttempts < 2) {
          quizMessage.textContent = `再听听看，还有机会哦`;
        } else {
          quizMessage.textContent = `正确答案是“${correct}”`;
          allCards.forEach(c => { if (c.textContent === correct) c.classList.add('correct-highlight'); });
          currentQuizWords.shift();
          setTimeout(() => {
            if (currentQuizWords.length > 0) nextQuizWord();
            else finishQuiz();
          }, 1500);
        }
        setTimeout(() => {
          card.classList.remove('wrong-flash');
          allCards.forEach(c => c.classList.remove('correct-highlight'));
        }, 1000);
      }
    }

    function finishQuiz() {
      quizActive = false;
      quizMessage.textContent = '🏅 测验完成！你真是识字小英雄！';
      quizCompleteBtn.classList.remove('hidden');
      spawnStars(14);
      if (currentLevelIndex+1 < LEVELS.length && progress.unlockedLevel <= currentLevelIndex+1) {
        progress.unlockedLevel = currentLevelIndex+2;
        saveProgress();
      }
      addStars(5);
      quizCompleteBtn.onclick = () => {
        quizScreen.classList.add('hidden');
        mapScreen.classList.remove('hidden');
        renderMap();
      };
    }

    function getDistractors(correct, count, li) {
      const pool = [];
      for (let i = Math.max(0, li-1); i <= Math.min(LEVELS.length-1, li+1); i++) {
        pool.push(...LEVELS[i].words.filter(w => w !== correct));
      }
      const unique = [...new Set(pool)];
      shuffleArray(unique);
      return unique.slice(0, count);
    }
    function shuffleArray(arr) { for (let i=arr.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } }
    document.getElementById('backToMapBtn').addEventListener('click', ()=>{ groupScreen.classList.add('hidden'); mapScreen.classList.remove('hidden'); renderMap(); });

    loadProgress();
    startScreen.classList.remove('hidden');
    mapScreen.classList.add('hidden');
  })();
</script>
